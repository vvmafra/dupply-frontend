name: CI

on:
  push:
    branches: [main, feat/demo-local, feat/design-system]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Design system lint
        # Vira bloqueante quando T4 (aplicar DS nas telas) zerar as violações.
        continue-on-error: true
        run: npm run lint:ds

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCKS: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Install Playwright
        # playwright ainda não está no package-lock (registry inacessível ao adicionar); entra como devDependency em T2.
        run: npm install --no-save playwright@1.58.0 && npx playwright install --with-deps chromium

      - name: Screenshots (light/dark, desktop/mobile)
        run: npm run ds:shots -- ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/ci
          retention-days: 14

      - name: Publish screenshots to branch ci-screenshots
        # Branch órfã com o último conjunto de screenshots; útil para revisar sem baixar artefato.
        if: always() && github.ref == 'refs/heads/feat/design-system'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/shots && mkdir -p /tmp/shots/shots
          cp -r screenshots/ci/* /tmp/shots/shots/ || true
          cd /tmp/shots
          printf '# Screenshots do CI\n\ncommit: %s\nrun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "screenshots de $GITHUB_SHA"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
